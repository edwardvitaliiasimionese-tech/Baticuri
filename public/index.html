<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Magazinul meu</title>
<style>
:root{--bg:#fff5f9;--card:#fce7f3;--tx:#500724;--mut:#9d5c78;--ac:#f9a8d4;--acx:#831843;--bd:#f9a8d4}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,#f9a8d4,#f472b6 50%,#ec4899) fixed;color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:18px 16px;max-width:1000px;margin:auto}
h1{font:700 1.6rem/1.2 Georgia,serif;margin:0}
.bar{display:flex;gap:8px;flex-wrap:wrap}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--bd);background:#fdf2f8;color:var(--tx);padding:9px 14px;border-radius:10px;text-decoration:none;display:inline-block;text-align:center}
.pri{background:var(--ac);color:var(--acx);border-color:#f472b6;font-weight:700}
.dng{color:#dc2626}
.shop{max-width:1100px;margin:auto;padding:0 12px 30px;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
header{max-width:1100px}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.side{position:sticky;top:10px;max-height:calc(100vh - 20px);overflow:auto;display:flex;flex-direction:column;gap:8px}
aside{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:10px;font-size:.82rem}
aside h3{margin:0 0 6px;font-size:.95rem}
.ln{display:flex;gap:6px;align-items:flex-start;padding:5px 0;border-bottom:1px solid var(--bd)}
.ln .t{flex:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ln .p{font-weight:700;white-space:nowrap}
.ln button{border:none;background:none;color:var(--mut);padding:0 2px;font-size:.8rem}
.tot{display:flex;justify-content:space-between;padding:8px 0;font-size:1rem}
aside .pri{width:100%}
@media(min-width:700px){.shop{padding:0 16px 30px;gap:16px}main{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}aside{font-size:.95rem;padding:14px}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;background:var(--bd)}
.gal img{flex:0 0 100%;width:100%;aspect-ratio:1;object-fit:cover;scroll-snap-align:center}
.nopic{aspect-ratio:1;display:grid;place-items:center;color:var(--mut)}
.body{padding:8px;display:flex;flex-direction:column;gap:5px;flex:1}
.body h2{margin:0;font-size:.82rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.gal{cursor:pointer}
.body button{padding:6px 4px;font-size:.78rem;border-radius:8px}
@media(min-width:700px){.body h2{font-size:1rem}.body button{font-size:.9rem;padding:8px}}
.body p{display:none}
.price{font-weight:700;font-size:.95rem;flex:1}
@media(min-width:700px){.price{font-size:1.15rem}}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:50px 0}
footer{text-align:center;padding:0 0 30px}
footer a{color:var(--mut);font-size:.8rem;cursor:pointer;text-decoration:underline}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:9}
@media(min-width:600px){.ov{align-items:center}}
.dlg{background:var(--card);width:100%;max-width:460px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:20px}
@media(min-width:600px){.dlg{border-radius:18px}}
.dlg h3{margin:0 0 12px}
label{display:block;font-size:.85rem;color:var(--mut);margin:10px 0 4px}
input,textarea{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.row>*{flex:1}
.thumbs{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.thumbs img{width:56px;height:56px;object-fit:cover;border-radius:8px}
.box{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
.box small{color:var(--mut);display:block}.box b{word-break:break-all}
.note{color:var(--mut);font-size:.85rem}
.card,.dlg{color:var(--tx)}
h1{text-shadow:0 2px 10px rgba(255,255,255,.6)}
.empty{color:#831843}
footer a{color:#9d174d}
.nd{font-size:.72rem;color:#be123c;font-weight:600;line-height:1.2}
header,.shop,footer{position:relative;z-index:1}
.card.sold .gal,.card.sold .nopic{opacity:.4}
button:disabled{opacity:.6;cursor:default}
.vr{display:flex;gap:6px;margin-bottom:8px;align-items:center;flex-wrap:wrap}.vr .vp{display:flex;gap:4px;align-items:center}.vr .vp img{width:40px;height:40px;object-fit:cover;border-radius:8px}.vr [data-vn]{flex:2;min-width:90px}.vr [data-vp]{flex:1;min-width:70px}.vr button{padding:4px 8px}.vimg{width:64px;height:64px;object-fit:cover;border-radius:10px}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:30;display:flex;align-items:center;justify-content:center}
.zoom img{max-width:100%;max-height:100%;object-fit:contain}
.zoom button{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px}
.gal img,.vimg{cursor:zoom-in}
.sw{display:inline-block;width:.8em;height:.8em;border-radius:50%;border:1px solid rgba(0,0,0,.35);margin-right:5px;vertical-align:-1px}
.dlg .sw{width:1em;height:1em}
.vc{display:flex;gap:4px;align-items:center}.vc input[type=color]{width:34px;height:34px;padding:0;border:none;background:none;cursor:pointer}
.vc{flex-wrap:wrap}.vc.open{flex-basis:100%}.cp{flex-basis:100%;width:100%}.pal{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.pal button{width:26px;height:26px;border-radius:50%;padding:0;border:1px solid rgba(0,0,0,.35)}
.qs{display:inline-flex;align-items:center;gap:6px}.qs button{padding:0;width:26px;height:26px;border-radius:50%;line-height:1;font-size:1rem}.qs b{min-width:1.3em;text-align:center}.body .qs{display:flex;justify-content:center}.ln .t.c{display:block;overflow:visible}.tt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
</style>
</head>
<body>
<div id="root"></div>
<footer id="foot"></footer>
<script>
const $=s=>document.querySelector(s);
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CUR='EUR'; // schimbă în 'RON' pentru lei
const eur=n=>new Intl.NumberFormat('ro-RO',{style:'currency',currency:CUR}).format(n);
let S={settings:{},items:[],orders:[]},admin=false,cart=[];
try{cart=JSON.parse(localStorage.getItem('cart')||'[]');}catch(e){}
const saveCart=()=>{try{localStorage.setItem('cart',JSON.stringify(cart));}catch(e){}};
const lno=i=>i.title+(i.qty>1?' ×'+i.qty:'');
const oi=x=>x.items||[{id:x.itemId,title:x.title,price:x.price}];
const ot=x=>x.total!=null?x.total:oi(x).reduce((t,i)=>t+i.price*(i.qty||1),0);

async function api(url,opt){
  const r=await fetch(url,opt);const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||'Eroare');return j;
}
async function refresh(){
  S=await api('/api/shop');admin=(await api('/api/me')).admin;S.orders=admin?await api('/api/orders'):[];
  const cnt={};cart=cart.filter(k=>{const u=unit(k);if(!u||u.sold)return false;cnt[k]=(cnt[k]||0)+1;return cnt[k]<=u.left;});saveCart();
  document.title=S.settings.shop;render();
}
function modal(html,lock){
  const o=document.createElement('div');o.className='ov';o.innerHTML='<div class="dlg">'+html+'</div>';
  if(!lock)o.addEventListener('click',e=>{if(e.target===o)o.remove();});document.body.appendChild(o);return o;
}
function resize(file){return new Promise(res=>{
  const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{
    const k=Math.min(1,1200/Math.max(i.width,i.height)),c=document.createElement('canvas');
    c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);
    c.toBlob(b=>res(b),'image/jpeg',.82);};i.onerror=()=>res(null);i.src=r.result;};
  r.onerror=()=>res(null);r.readAsDataURL(file);});}

function render(){
  const st=S.settings;
  $('#root').innerHTML=
   '<header><h1>'+esc(st.shop)+'</h1>'+'<div class="bar"><button class="pri" id="cartb">🛒 Coș'+(cart.length?' ('+cart.length+')':'')+'</button>'+(admin?'<button class="pri" id="add">+ Articol</button><button id="ord">Comenzi'+(S.orders.filter(x=>!x.paid).length?' ('+S.orders.filter(x=>!x.paid).length+')':'')+'</button><button id="set">Setări</button><button id="out">Deconectare</button>':'')+'</div>'+'</header>'+
   '<div class="shop"><main>'+(S.items.length?S.items.map(it=>
    '<div class="card'+(it.sold||it.reserved?' sold':'')+'">'+(it.imgs.length?'<div class="gal" data-open="'+esc(it.id)+'">'+it.imgs.map(s=>'<img loading="lazy" src="'+esc(s)+'" alt="">').join('')+'</div>':'<div class="nopic">Fără poză</div>')+
    '<div class="body"><h2 data-open="'+esc(it.id)+'">'+sw(it.color)+esc(it.title)+'</h2><p>'+esc(it.desc)+'</p><div class="price">'+(it.variants&&it.variants.length?'de la ':'')+eur(it.price)+'</div>'+
    (it.sold?'<button disabled>Vândut</button>':it.reserved?'<div class="nd">Articolul nu este disponibil momentan</div><button disabled>Indisponibil</button>':(it.variants&&it.variants.length)?'<button class="pri" data-open="'+esc(it.id)+'">Alege</button>':(qOf(it.id)?stepper(it.id):'<button class="pri" data-cart="'+esc(it.id)+'">＋ Coș</button>'))+
    (admin?'<button data-edit="'+esc(it.id)+'">Editează</button><button class="dng" data-del="'+esc(it.id)+'">Șterge</button>':'')+'</div></div>').join('')
    :'<div class="empty">Niciun articol deocamdată.</div>')+'</main>'+sideHtml()+'</div>';
  $('#foot').innerHTML=admin?'':'<a id="login">Zonă vânzător</a>';
  if($('#login'))$('#login').onclick=loginForm;
  if(admin){
    $('#add').onclick=addForm;$('#ord').onclick=ordersView;
    document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editForm(S.items.find(x=>x.id===b.dataset.edit)));$('#set').onclick=settings;
    $('#out').onclick=async()=>{await api('/api/logout',{method:'POST'});refresh();};
    document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
      if(!confirm('Ștergi acest articol?'))return;
      try{await api('/api/items/'+b.dataset.del,{method:'DELETE'});refresh();}catch(e){alert(e.message);}});
  }
  $('#cartb').onclick=cartView;
  document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{cart=cart.filter(x=>x!==b.dataset.x);saveCart();render();});
  if($('#side-go'))$('#side-go').onclick=cartView;
  if($('#side-ord'))$('#side-ord').onclick=ordersView;
  document.querySelectorAll('[data-open]').forEach(e=>e.onclick=()=>openItem(S.items.find(x=>x.id===e.dataset.open)));
  document.querySelectorAll('[data-cart]').forEach(b=>b.onclick=()=>{addOne(b.dataset.cart);render();});
  bindQty($('#root'),render);
}

function loginForm(){
  const o=modal('<h3>Zonă vânzător</h3><label>Parolă</label><input id="pw" type="password" autocomplete="current-password"><div class="row"><button id="no">Anulează</button><button class="pri" id="ok">Intră</button></div>');
  const go=async()=>{try{await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:o.querySelector('#pw').value})});o.remove();refresh();}catch(e){alert(e.message);}};
  o.querySelector('#no').onclick=()=>o.remove();o.querySelector('#ok').onclick=go;
  o.querySelector('#pw').onkeydown=e=>{if(e.key==='Enter')go();};o.querySelector('#pw').focus();
}

function ordersAside(){
  if(!admin)return '';
  const L=S.orders.slice(0,5),n=S.orders.filter(x=>!x.paid).length;
  return '<aside><h3>📦 Comenzi'+(n?' ('+n+')':'')+'</h3>'+(L.length?
    L.map(x=>'<div class="ln"><span class="t" style="-webkit-line-clamp:3"><b>'+esc(x.name)+'</b><br>'+esc(oi(x).map(lno).join(', '))+'</span><span class="p">'+eur(ot(x))+'<br>'+(x.paid?'✅':'⏳')+'</span></div>').join('')
    :'<p class="note">Nicio comandă deocamdată.</p>')+
    '<button class="pri" id="side-ord" style="margin-top:8px">Vezi toate comenzile</button></aside>';
}

function sideHtml(){
  const L=cartLines(),total=L.reduce((t,i)=>t+i.price*i.q,0);
  return '<div class="side"><aside><h3>🛒 Coșul meu</h3>'+(L.length?
    L.map(i=>'<div class="ln"><span class="t c"><span class="tt">'+esc(i.title)+'</span>'+stepper(i.id)+'</span><span class="p">'+eur(i.price*i.q)+'</span><button data-x="'+esc(i.id)+'" aria-label="Elimină">✕</button></div>').join('')+
    '<div class="tot"><span>Total</span><b>'+eur(total)+'</b></div><button class="pri" id="side-go">Comandă</button>'
    :'<p class="note">Gol deocamdată.</p>')+'</aside>'+ordersAside()+'</div>';
}

function zoom(src){
  const z=document.createElement('div');z.className='zoom';
  z.innerHTML='<img src="'+esc(src)+'" alt=""><button type="button">✕</button>';
  z.onclick=()=>z.remove();document.body.appendChild(z);
}

const qOf=k=>cart.filter(x=>x===k).length;
const addOne=k=>{const u=unit(k);if(u&&!u.sold&&qOf(k)<u.left){cart.push(k);saveCart();}};
const subOne=k=>{const i=cart.indexOf(k);if(i>=0){cart.splice(i,1);saveCart();}};
function cartLines(){const m=new Map();cart.forEach(k=>m.set(k,(m.get(k)||0)+1));return [...m].map(([k,q])=>{const u=unit(k);return u?{...u,q}:null;}).filter(Boolean);}
function stepper(k){const u=unit(k),q=qOf(k);return '<span class="qs"><button type="button" data-qm="'+esc(k)+'">−</button><b>'+q+'</b><button type="button" data-qp="'+esc(k)+'"'+(u&&q>=u.left?' disabled':'')+'>+</button></span>';}
function bindQty(root,after){
  root.querySelectorAll('[data-qm]').forEach(b=>b.onclick=()=>{subOne(b.dataset.qm);after();});
  root.querySelectorAll('[data-qp]').forEach(b=>b.onclick=()=>{addOne(b.dataset.qp);after();});
}
function qtyInput(box,init,cb){
  const st={v:Math.max(1,parseInt(init)||1)};
  const draw=()=>{
    box.innerHTML='<button type="button" data-d>−</button><b>'+st.v+'</b><button type="button" data-u>+</button>';
    box.querySelector('[data-d]').onclick=()=>{if(st.v>1){st.v--;if(cb)cb(st.v);draw();}};
    box.querySelector('[data-u]').onclick=()=>{if(st.v<999){st.v++;if(cb)cb(st.v);draw();}};
  };
  draw();return st;
}

function unit(key){
  const [iid,vid]=String(key).split(':'),it=S.items.find(i=>i.id===iid);
  if(!it)return null;
  if(vid){const v=(it.variants||[]).find(x=>x.id===vid);return v?{id:key,title:it.title+' – '+v.name,price:v.price,sold:v.sold,reserved:v.reserved,left:v.left}:null;}
  if((it.variants||[]).length)return null;
  return {id:key,title:it.title,price:it.price,sold:it.sold,reserved:it.reserved,left:it.left};
}

function openItem(it){
  if(!it)return;
  const o=modal('');
  const btn=(key,sold,res)=>sold?'<button disabled>Vândut</button>':res?'<button disabled>Indisponibil</button>':(qOf(key)?stepper(key):'<button class="pri" data-tg="'+esc(key)+'">Adaugă în coș</button>');
  const draw=()=>{
    const V=it.variants||[];
    o.querySelector('.dlg').innerHTML=(it.imgs.length?'<div class="gal" style="border-radius:12px;margin-bottom:12px">'+it.imgs.map(s=>'<img src="'+esc(s)+'" alt="">').join('')+'</div>':'')+
      '<h3>'+sw(it.color)+esc(it.title)+'</h3><p style="white-space:pre-wrap;color:var(--mut)">'+esc(it.desc)+'</p>'+
      (V.length?V.map(v=>'<div class="box" style="display:flex;gap:10px;align-items:flex-start">'+(v.img?'<img class="vimg" src="'+esc(v.img)+'" alt="">':'')+'<div style="flex:1"><b>'+sw(v.color)+esc(v.name)+'</b><small>'+eur(v.price)+(v.reserved&&!v.sold?' · Articolul nu este disponibil momentan':'')+(v.qty>1&&!v.sold&&!v.reserved?' · disponibile: '+v.left:'')+'</small><div style="margin-top:8px">'+btn(it.id+':'+v.id,v.sold,v.reserved)+'</div></div></div>').join('')
       :(it.reserved&&!it.sold?'<p class="nd">Articolul nu este disponibil momentan</p>':'')+''+(it.qty>1&&!it.sold&&!it.reserved?'<p class="note">Disponibile: '+it.left+' buc.</p>':'')+'<div class="price" style="font-size:1.3rem">'+eur(it.price)+'</div><div class="row">'+btn(it.id,it.sold,it.reserved)+'</div>')+
      '<div class="row"><button id="cl">Închide</button></div>';
    o.querySelector('#cl').onclick=()=>o.remove();
    o.querySelectorAll('.gal img,.vimg').forEach(im=>im.onclick=()=>zoom(im.src));
    o.querySelectorAll('[data-tg]').forEach(b=>b.onclick=()=>{addOne(b.dataset.tg);render();draw();});
    bindQty(o,()=>{render();draw();});
  };
  draw();
}

function cartView(){
  const o=modal('');
  const draw=()=>{
    const nv=o.querySelector('#n'),pv=o.querySelector('#ph'),n0=nv?nv.value:'',p0=pv?pv.value:'';
    const L=cartLines(),total=L.reduce((t,i)=>t+i.price*i.q,0);
    o.querySelector('.dlg').innerHTML='<h3>Coșul meu</h3>'+(L.length?
      L.map(i=>'<div class="box"><b>'+esc(i.title)+'</b><small>'+eur(i.price)+' × '+i.q+' = '+eur(i.price*i.q)+'</small><div style="display:flex;gap:10px;align-items:center;margin-top:8px">'+stepper(i.id)+'<button class="dng" data-rm="'+esc(i.id)+'">Elimină</button></div></div>').join('')+
      '<div class="box"><small>Total de plată</small><b>'+eur(total)+'</b></div>'+
      '<label>Numele tău</label><input id="n" autocomplete="name" value="'+esc(n0)+'"><label>Numărul tău de WhatsApp (cu prefixul țării)</label><input id="ph" type="tel" autocomplete="tel" inputmode="tel" placeholder="+40 712 345 678" value="'+esc(p0)+'">'+
      '<div class="row"><button id="cl">Continuă cumpărăturile</button><button class="pri" id="ok">Comandă</button></div>'
      :'<p class="note">Coșul tău este gol.</p><div class="row"><button id="cl">Închide</button></div>');
    o.querySelector('#cl').onclick=()=>o.remove();
    o.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{cart=cart.filter(x=>x!==b.dataset.rm);saveCart();render();draw();});
    bindQty(o,()=>{render();draw();});
    const ok=o.querySelector('#ok');
    if(ok)ok.onclick=async()=>{
      const name=o.querySelector('#n').value.trim(),phone=o.querySelector('#ph').value.trim();
      if(!name||!/^(\+|00)\d[\d\s.-]{7,}$/.test(phone)){alert('Trebuie numele tău și numărul de WhatsApp cu prefixul țării, de exemplu +40 712 345 678.');return;}
      ok.disabled=true;ok.textContent='Se trimite…';
      try{
        await api('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({itemIds:cart,name,phone})});
        cart=[];saveCart();o.remove();refresh();pay(L,total,name,phone);
      }catch(x){alert(x.message);await refresh();draw();}
    };
  };
  draw();
}

function pay(L,total,name,phone){
  const wn=(S.settings.wa||'').replace(/\D/g,'');
  const wa=wn?'https://wa.me/'+wn+'?text='+encodeURIComponent('Bună, am făcut o comandă ('+L.map(i=>i.title+(i.q>1?' ×'+i.q:'')).join(', ')+', total '+eur(total)+'). Numele meu: '+name):'';
  const o=modal('<h3>Mulțumim, '+esc(name)+'!</h3><p>Comanda ta a fost înregistrată: '+L.map(i=>esc(i.title+(i.q>1?' ×'+i.q:''))).join(', ')+'.<br>Total: <b>'+eur(total)+'</b></p>'+
   (wa?'<div class="box"><b>⚠️ Ultimul pas: anunță vânzătorul pe WhatsApp</b><small style="margin-top:6px">Este obligatoriu pentru ca vânzătorul să-ți confirme comanda. Apasă butonul de mai jos și trimite mesajul.</small></div>':'')+
   '<div class="box"><b>💵 Plata, de preferat în numerar (cash)</b><small style="margin-top:6px">Vânzătorul te va contacta pentru a vă înțelege.</small></div>'+
   '<div class="box"><b>📲 Altfel, vei primi numărul de cont (IBAN) în privat pe WhatsApp</b><small style="margin-top:6px">Vânzătorul îți scrie pe numărul indicat de tine ('+esc(phone)+').</small></div>'+
   '<p class="note">Dacă plătești prin transfer bancar, fă-o doar după ce ai primit mesajul lui. Comanda ta este confirmată imediat ce plata a fost primită.</p>'+

  w.document.write('<!doctype html><html lang="ro"><head><meta charset="utf-8"><title>Comanda '+esc(x.id)+'</title><style>@page{size:A4;margin:12mm}body{font:12px/1.4 Arial,sans-serif;color:#111;margin:0;max-width:180mm}h1{margin:0 0 2px;font-size:18px}h2{margin:12px 0 4px;font-size:13px}table{width:100%;border-collapse:collapse;margin:6px 0}th,td{padding:4px 6px;border-bottom:1px solid #ccc;text-align:left}th:last-child{text-align:right}.tot{text-align:right;font-size:14px;font-weight:bold;margin-top:6px}.m{color:#555}</style></head><body>'+
    '<h1>'+esc(S.settings.shop)+'</h1><div class="m">Detalii comandă</div>'+
    '<h2>Comanda nr. '+esc(x.id)+'</h2><div>Data: '+esc(new Date(x.date).toLocaleString('ro-RO'))+'</div>'+
    '<div>Stare: <b>'+(x.paid?'Plătită':'Neplătită')+'</b></div>'+
    '<h2>Client</h2><div>Nume: '+esc(x.name)+'</div><div>Telefon: '+esc(x.phone)+'</div>'+
    '<h2>Articole</h2><table><tr><th>Articol</th><th>Cant.</th><th>Preț</th></tr>'+rows+'</table>'+

const PHOTO_UI='<div class="row"><button type="button" id="camb">📷 Fă o poză</button></div><input id="cam" type="file" accept="image/*" capture="environment" hidden><label>sau alege din galerie</label><input id="f" type="file" accept="image/*" multiple><div class="thumbs" id="th"></div>';

function photoPicker(o){
  const st={blobs:[]};
  const draw=()=>{
    o.querySelector('#th').innerHTML=st.blobs.map((b,i)=>'<div style="position:relative"><img src="'+URL.createObjectURL(b)+'"><button type="button" data-n="'+i+'" style="position:absolute;top:-6px;right:-6px;padding:0 6px;border-radius:50%">✕</button></div>').join('');
    o.querySelectorAll('[data-n]').forEach(x=>x.onclick=()=>{st.blobs.splice(+x.dataset.n,1);draw();});
  };
  const add=async files=>{
    const nb=(await Promise.all([...files].map(resize))).filter(Boolean);
    st.blobs=[...st.blobs,...nb].slice(0,6);draw();
  };
  o.querySelector('#camb').onclick=()=>o.querySelector('#cam').click();
  o.querySelector('#cam').onchange=e=>{add(e.target.files);e.target.value='';};
  o.querySelector('#f').onchange=e=>{add(e.target.files);e.target.value='';};
  return st;
}

const sw=c=>c&&/^#[0-9a-f]{6}$/i.test(c)?'<span class="sw" style="background:'+c+'"></span>':'';

function pickFromPhoto(srcs,onPick){
  if(!srcs.length){alert('Adaugă mai întâi o poză.');return;}
  const o=modal('<h3>Alege culoarea din poză</h3><p class="note">Apasă pe poză, exact în locul cu culoarea dorită.</p><div class="thumbs" id="pt">'+srcs.map((x,i)=>'<img src="'+esc(x)+'" data-p="'+i+'" style="cursor:pointer">').join('')+'</div><canvas id="cv" style="width:100%;margin-top:8px;border-radius:10px"></canvas><div class="row" style="align-items:center"><span id="pv" class="sw" style="width:34px;height:34px;flex:none;margin:0;background:transparent"></span><button class="pri" id="ok" disabled>Folosește culoarea</button><button id="no">Anulează</button></div>');
  const cv=o.querySelector('#cv'),ctx=cv.getContext('2d',{willReadFrequently:true});let cur='';
  const load=src=>{
    const im=new Image();im.crossOrigin='anonymous';
    im.onload=()=>{const k=Math.min(1,700/Math.max(im.width,im.height));cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);ctx.drawImage(im,0,0,cv.width,cv.height);};
    im.onerror=()=>alert('Nu pot citi această poză. Încearcă cu o poză nouă.');
    im.src=src;
  };
  o.querySelectorAll('[data-p]').forEach(t=>t.onclick=()=>load(srcs[+t.dataset.p]));
  load(srcs[0]);
  cv.onclick=e=>{
    const r=cv.getBoundingClientRect(),x=Math.round((e.clientX-r.left)*cv.width/r.width),y=Math.round((e.clientY-r.top)*cv.height/r.height);
    try{
      const x0=Math.max(0,x-4),y0=Math.max(0,y-4),w=Math.min(9,cv.width-x0),h=Math.min(9,cv.height-y0),d=ctx.getImageData(x0,y0,w,h).data;
      let R=0,G=0,B=0,n=d.length/4;
      for(let i=0;i<d.length;i+=4){R+=d[i];G+=d[i+1];B+=d[i+2];}
      cur='#'+[R,G,B].map(v=>Math.round(v/n).toString(16).padStart(2,'0')).join('');
      o.querySelector('#pv').style.background=cur;o.querySelector('#ok').disabled=false;
    }catch(err){alert('Această poză nu poate fi citită. Încearcă cu o poză nouă.');}
  };
  o.querySelector('#no').onclick=()=>o.remove();
  o.querySelector('#ok').onclick=()=>{onPick(cur);o.remove();};
}

function colorPicker(box,init,cb,getSrcs){
  const st={v:init||''};let open=false;
  const PRE=['#87ceeb','#1e90ff','#00008b','#2e8b57','#90ee90','#ffd700','#ff8c00','#ff0000','#ff69b4','#800080','#8b4513','#808080','#000000','#ffffff'];
  const set=v=>{st.v=v;if(cb)cb(v);draw();};
  const draw=()=>{
    box.classList.toggle('open',open);
    box.innerHTML='<button type="button" data-tog>'+(st.v?'<span class="sw" style="background:'+esc(st.v)+';margin:0"></span> ':'🎨 ')+'Culoare</button>'+
      (open?'<div class="cp"><div class="pal">'+PRE.map(c=>'<button type="button" data-pc="'+c+'" style="background:'+c+'"></button>').join('')+'</div><div class="row" style="margin-top:6px"><input type="color" data-cc value="'+esc(st.v||'#87ceeb')+'"><button type="button" data-pp>💧 Pipetă din poză</button><button type="button" data-cx>✕ Fără</button></div></div>':'');
    box.querySelector('[data-tog]').onclick=()=>{open=!open;draw();};
    box.querySelectorAll('[data-pc]').forEach(x=>x.onclick=()=>set(x.dataset.pc));
    const cc=box.querySelector('[data-cc]');
    if(cc){cc.oninput=()=>{st.v=cc.value;if(cb)cb(cc.value);};cc.onchange=()=>set(cc.value);}
    const pp=box.querySelector('[data-pp]');if(pp)pp.onclick=()=>pickFromPhoto(getSrcs?getSrcs():[],c=>set(c));
    const cx=box.querySelector('[data-cx]');if(cx)cx.onclick=()=>set('');
  };
  draw();return st;
}

const VAR_UI='<label>Culoare (opțională)</label><div id="icol" class="vc"></div><label>Cantitate disponibilă (dacă nu ai variante)</label><div class="qs" id="iq"></div><label>Variante (opțional) : fiecare cu prețul ei</label><div id="vars"></div><div class="row"><button type="button" id="addv">+ Adaugă variantă</button></div>';

function variantsEditor(o,init,getSrcs){
  const V=(init||[]).map(v=>({id:v.id,name:v.name,price:v.price,img:v.img||'',file:null,url:v.img||'',color:v.color||'',qty:v.qty||1}));
  const draw=()=>{
    o.querySelector('#vars').innerHTML=V.map((v,i)=>'<div class="vr"><div class="vp">'+(v.url?'<img src="'+esc(v.url)+'">':'')+'<button type="button" data-vc="'+i+'" title="Fă o poză">📷</button><button type="button" data-vg="'+i+'" title="Alege din galerie">🖼</button>'+(v.url?'<button type="button" data-vd="'+i+'">🗑</button>':'')+'<input type="file" accept="image/*" capture="environment" hidden data-vf="'+i+'"><input type="file" accept="image/*" hidden data-vf="'+i+'"></div><input data-vn="'+i+'" placeholder="Nume (ex. albastră)" value="'+esc(v.name)+'"><input data-vp="'+i+'" type="number" min="0" step="0.01" inputmode="decimal" placeholder="Preț" value="'+esc(v.price)+'"><div class="vc" data-vcol="'+i+'"></div><div class="qs" data-vq="'+i+'" title="Cantitate"></div><button type="button" data-vx="'+i+'">✕</button></div>').join('');
    o.querySelectorAll('[data-vn]').forEach(x=>x.oninput=()=>{V[+x.dataset.vn].name=x.value;});
    o.querySelectorAll('[data-vp]').forEach(x=>x.oninput=()=>{V[+x.dataset.vp].price=x.value;});
    o.querySelectorAll('[data-vx]').forEach(x=>x.onclick=()=>{V.splice(+x.dataset.vx,1);draw();});
    o.querySelectorAll('[data-vc]').forEach(x=>x.onclick=()=>o.querySelector('[data-vf="'+x.dataset.vc+'"][capture]').click());
    o.querySelectorAll('[data-vg]').forEach(x=>x.onclick=()=>o.querySelector('[data-vf="'+x.dataset.vg+'"]:not([capture])').click());
    o.querySelectorAll('[data-vd]').forEach(x=>x.onclick=()=>{const v=V[+x.dataset.vd];v.file=null;v.url='';v.img='';draw();});
    o.querySelectorAll('[data-vq]').forEach(b=>{const k=+b.dataset.vq;qtyInput(b,V[k].qty||1,n=>{V[k].qty=n;});});
    o.querySelectorAll('[data-vcol]').forEach(b=>{const k=+b.dataset.vcol;colorPicker(b,V[k].color,c=>{V[k].color=c;},()=>[...new Set([V[k].url,...(getSrcs?getSrcs():[])].filter(Boolean))]);});
    o.querySelectorAll('[data-vf]').forEach(x=>x.onchange=async()=>{
      const bl=x.files[0]?await resize(x.files[0]):null;
      if(bl){const v=V[+x.dataset.vf];v.file=bl;v.url=URL.createObjectURL(bl);draw();}
    });
  };
  o.querySelector('#addv').onclick=()=>{V.push({name:'',price:'',img:'',file:null,url:'',color:'',qty:1});draw();};
  draw();
  return V;
}

function editForm(it){
  if(!it)return;
  let keep=[...it.imgs],blobs=[];
  const o=modal('<h3>Editează articolul</h3><label>Titlu</label><input id="t" value="'+esc(it.title)+'"><label>Descriere</label><textarea id="d" rows="3">'+esc(it.desc)+'</textarea><label>Preț (dacă nu ai variante)</label><input id="p" type="number" min="0" step="0.01" inputmode="decimal" value="'+esc(it.price)+'">'+VAR_UI+'<label>Pozele actuale (apasă ✕ ca să ștergi o poză)</label><div class="thumbs" id="old"></div><label>Adaugă poze noi (maxim 6 în total)</label>'+PHOTO_UI+'<div class="row"><button id="no">Anulează</button><button class="pri" id="ok">Salvează</button></div>');
  const drawOld=()=>{
    o.querySelector('#old').innerHTML=keep.map((s,i)=>'<div style="position:relative"><img src="'+esc(s)+'"><button data-k="'+i+'" style="position:absolute;top:-6px;right:-6px;padding:0 6px;border-radius:50%">✕</button></div>').join('')||'<span class="note">Nicio poză</span>';
    o.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{keep.splice(+b.dataset.k,1);drawOld();});
  };
  drawOld();
  o.querySelector('#no').onclick=()=>o.remove();
  const P=photoPicker(o);
  const srcs=()=>[...keep,...P.blobs.map(b=>URL.createObjectURL(b)),...V.map(v=>v.url).filter(Boolean)];
  const V=variantsEditor(o,it.variants||[],()=>srcs());
  const C=colorPicker(o.querySelector('#icol'),it.color||'',null,()=>srcs());
  const Q=qtyInput(o.querySelector('#iq'),it.qty||1);
  o.querySelector('#ok').onclick=async e=>{
    const t=o.querySelector('#t').value.trim(),p=o.querySelector('#p').value;
    const vs=V.filter(v=>String(v.name).trim());
    if(vs.some(v=>v.price===''||isNaN(parseFloat(v.price))||parseFloat(v.price)<0)){alert('Fiecare variantă are nevoie de nume și preț.');return;}
    if(!t||(!vs.length&&p==='')){alert('Trebuie un titlu și un preț.');return;}
    if(keep.length+P.blobs.length>6){alert('Maxim 6 poze.');return;}
    const fd=new FormData();fd.append('title',t);fd.append('desc',o.querySelector('#d').value);fd.append('price',p||'0');fd.append('variants',JSON.stringify(vs.map(v=>({id:v.id,name:String(v.name).trim(),price:parseFloat(v.price),img:v.file?'':v.img,color:v.color||'',qty:v.qty||1}))));fd.append('color',C.v);fd.append('qty',Q.v);const vi=[];vs.forEach((v,i)=>{if(v.file){fd.append('vimgs',v.file,'v'+i+'.jpg');vi.push(i);}});fd.append('vimgIdx',JSON.stringify(vi));fd.append('keep',JSON.stringify(keep));
    P.blobs.forEach((b,i)=>fd.append('images',b,'p'+i+'.jpg'));
    e.target.disabled=true;e.target.textContent='Se trimite…';
    try{await api('/api/items/'+it.id,{method:'PUT',body:fd});o.remove();refresh();}
    catch(x){alert(x.message);e.target.disabled=false;e.target.textContent='Salvează';}
  };
}
