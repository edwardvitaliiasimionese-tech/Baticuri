<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Magazinul meu</title>
<style>
:root{--bg:#fff5f9;--card:#fce7f3;--tx:#500724;--mut:#9d5c78;--ac:#f9a8d4;--acx:#831843;--bd:#f9a8d4}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,#f9a8d4,#f472b6 50%,#ec4899) fixed;color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:18px 16px;max-width:1000px;margin:auto}
h1{font:700 1.6rem/1.2 Georgia,serif;margin:0}
.bar{display:flex;gap:8px;flex-wrap:wrap}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--bd);background:#fdf2f8;color:var(--tx);padding:9px 14px;border-radius:10px;text-decoration:none;display:inline-block;text-align:center}
.pri{background:var(--ac);color:var(--acx);border-color:#f472b6;font-weight:700}
.dng{color:#dc2626}
.shop{max-width:1100px;margin:auto;padding:0 12px 30px;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
header{max-width:1100px}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.side{position:sticky;top:10px;max-height:calc(100vh - 20px);overflow:auto;display:flex;flex-direction:column;gap:8px}
aside{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:10px;font-size:.82rem}
aside h3{margin:0 0 6px;font-size:.95rem}
.ln{display:flex;gap:6px;align-items:flex-start;padding:5px 0;border-bottom:1px solid var(--bd)}
.ln .t{flex:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ln .p{font-weight:700;white-space:nowrap}
.ln button{border:none;background:none;color:var(--mut);padding:0 2px;font-size:.8rem}
.tot{display:flex;justify-content:space-between;padding:8px 0;font-size:1rem}
aside .pri{width:100%}
@media(min-width:700px){.shop{padding:0 16px 30px;gap:16px}main{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}aside{font-size:.95rem;padding:14px}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;background:var(--bd)}
.gal img{flex:0 0 100%;width:100%;aspect-ratio:1;object-fit:cover;scroll-snap-align:center}
.nopic{aspect-ratio:1;display:grid;place-items:center;color:var(--mut)}
.body{padding:8px;display:flex;flex-direction:column;gap:5px;flex:1}
.body h2{margin:0;font-size:.82rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.gal{cursor:pointer}
.body button{padding:6px 4px;font-size:.78rem;border-radius:8px}
@media(min-width:700px){.body h2{font-size:1rem}.body button{font-size:.9rem;padding:8px}}
.body p{display:none}
.price{font-weight:700;font-size:.95rem;flex:1}
@media(min-width:700px){.price{font-size:1.15rem}}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:50px 0}
footer{text-align:center;padding:0 0 30px}
footer a{color:var(--mut);font-size:.8rem;cursor:pointer;text-decoration:underline}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:9}
@media(min-width:600px){.ov{align-items:center}}
.dlg{background:var(--card);width:100%;max-width:460px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:20px}
@media(min-width:600px){.dlg{border-radius:18px}}
.dlg h3{margin:0 0 12px}
label{display:block;font-size:.85rem;color:var(--mut);margin:10px 0 4px}
input,textarea{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.row>*{flex:1}
.thumbs{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.thumbs img{width:56px;height:56px;object-fit:cover;border-radius:8px}
.box{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
.box small{color:var(--mut);display:block}.box b{word-break:break-all}
.note{color:var(--mut);font-size:.85rem}
.card,.dlg{color:var(--tx)}
h1{text-shadow:0 2px 10px rgba(255,255,255,.6)}
.empty{color:#831843}
footer a{color:#9d174d}
.nd{font-size:.72rem;color:#be123c;font-weight:600;line-height:1.2}
header,.shop,footer{position:relative;z-index:1}
.card.sold .gal,.card.sold .nopic{opacity:.4}
button:disabled{opacity:.6;cursor:default}
</style>
</head>
<body>
<div id="root"></div>
<footer id="foot"></footer>
<script>
const $=s=>document.querySelector(s);
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CUR='EUR'; // schimbă în 'RON' pentru lei
const eur=n=>new Intl.NumberFormat('ro-RO',{style:'currency',currency:CUR}).format(n);
let S={settings:{},items:[],orders:[]},admin=false,cart=[];
try{cart=JSON.parse(localStorage.getItem('cart')||'[]');}catch(e){}
const saveCart=()=>{try{localStorage.setItem('cart',JSON.stringify(cart));}catch(e){}};
const oi=x=>x.items||[{id:x.itemId,title:x.title,price:x.price}];
const ot=x=>x.total!=null?x.total:oi(x).reduce((t,i)=>t+i.price,0);

async function api(url,opt){
  const r=await fetch(url,opt);const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||'Eroare');return j;
}
async function refresh(){
  S=await api('/api/shop');admin=(await api('/api/me')).admin;S.orders=admin?await api('/api/orders'):[];
  cart=cart.filter(id=>S.items.some(i=>i.id===id&&!i.sold&&!i.reserved));saveCart();
  document.title=S.settings.shop;render();
}
function modal(html,lock){
  const o=document.createElement('div');o.className='ov';o.innerHTML='<div class="dlg">'+html+'</div>';
  if(!lock)o.addEventListener('click',e=>{if(e.target===o)o.remove();});document.body.appendChild(o);return o;
}
function resize(file){return new Promise(res=>{
  const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{
    const k=Math.min(1,1200/Math.max(i.width,i.height)),c=document.createElement('canvas');
    c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);
    c.toBlob(b=>res(b),'image/jpeg',.82);};i.onerror=()=>res(null);i.src=r.result;};
  r.onerror=()=>res(null);r.readAsDataURL(file);});}

function render(){
  const st=S.settings;
  $('#root').innerHTML=
   '<header><h1>'+esc(st.shop)+'</h1>'+'<div class="bar"><button class="pri" id="cartb">🛒 Coș'+(cart.length?' ('+cart.length+')':'')+'</button>'+(admin?'<button class="pri" id="add">+ Articol</button><button id="ord">Comenzi'+(S.orders.filter(x=>!x.paid).length?' ('+S.orders.filter(x=>!x.paid).length+')':'')+'</button><button id="set">Setări</button><button id="out">Deconectare</button>':'')+'</div>'+'</header>'+
   '<div class="shop"><main>'+(S.items.length?S.items.map(it=>
    '<div class="card'+(it.sold||it.reserved?' sold':'')+'">'+(it.imgs.length?'<div class="gal" data-open="'+esc(it.id)+'">'+it.imgs.map(s=>'<img loading="lazy" src="'+esc(s)+'" alt="">').join('')+'</div>':'<div class="nopic">Fără poză</div>')+
    '<div class="body"><h2 data-open="'+esc(it.id)+'">'+esc(it.title)+'</h2><p>'+esc(it.desc)+'</p><div class="price">'+eur(it.price)+'</div>'+
    (it.sold?'<button disabled>Vândut</button>':it.reserved?'<div class="nd">Articolul nu este disponibil momentan</div><button disabled>Indisponibil</button>':'<button class="pri" data-cart="'+esc(it.id)+'">'+(cart.includes(it.id)?'✓ Adăugat':'＋ Coș')+'</button>')+
    (admin?'<button class="dng" data-del="'+esc(it.id)+'">Șterge</button>':'')+'</div></div>').join('')
    :'<div class="empty">Niciun articol deocamdată.</div>')+'</main>'+sideHtml()+'</div>';
  $('#foot').innerHTML=admin?'':'<a id="login">Zonă vânzător</a>';
  if($('#login'))$('#login').onclick=loginForm;
  if(admin){
    $('#add').onclick=addForm;$('#ord').onclick=ordersView;$('#set').onclick=settings;
    $('#out').onclick=async()=>{await api('/api/logout',{method:'POST'});refresh();};
    document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
      if(!confirm('Ștergi acest articol?'))return;
      try{await api('/api/items/'+b.dataset.del,{method:'DELETE'});refresh();}catch(e){alert(e.message);}});
  }
  $('#cartb').onclick=cartView;
  document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{cart=cart.filter(x=>x!==b.dataset.x);saveCart();render();});
  if($('#side-go'))$('#side-go').onclick=cartView;
  if($('#side-ord'))$('#side-ord').onclick=ordersView;
  document.querySelectorAll('[data-open]').forEach(e=>e.onclick=()=>openItem(S.items.find(x=>x.id===e.dataset.open)));
  document.querySelectorAll('[data-cart]').forEach(b=>b.onclick=()=>{const id=b.dataset.cart;cart=cart.includes(id)?cart.filter(x=>x!==id):[...cart,id];saveCart();render();});
}

function loginForm(){
  const o=modal('<h3>Zonă vânzător</h3><label>Parolă</label><input id="pw" type="password" autocomplete="current-password"><div class="row"><button id="no">Anulează</button><button class="pri" id="ok">Intră</button></div>');
  const go=async()=>{try{await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:o.querySelector('#pw').value})});o.remove();refresh();}catch(e){alert(e.message);}};
  o.querySelector('#no').onclick=()=>o.remove();o.querySelector('#ok').onclick=go;
  o.querySelector('#pw').onkeydown=e=>{if(e.key==='Enter')go();};o.querySelector('#pw').focus();
}

function ordersAside(){
  if(!admin)return '';
  const L=S.orders.slice(0,5),n=S.orders.filter(x=>!x.paid).length;
  return '<aside><h3>📦 Comenzi'+(n?' ('+n+')':'')+'</h3>'+(L.length?
    L.map(x=>'<div class="ln"><span class="t" style="-webkit-line-clamp:3"><b>'+esc(x.name)+'</b><br>'+esc(oi(x).map(i=>i.title).join(', '))+'</span><span class="p">'+eur(ot(x))+'<br>'+(x.paid?'✅':'⏳')+'</span></div>').join('')
    :'<p class="note">Nicio comandă deocamdată.</p>')+
    '<button class="pri" id="side-ord" style="margin-top:8px">Vezi toate comenzile</button></aside>';
}

function sideHtml(){
  const L=cart.map(id=>S.items.find(i=>i.id===id)).filter(Boolean),total=L.reduce((t,i)=>t+i.price,0);
  return '<div class="side"><aside><h3>🛒 Coșul meu</h3>'+(L.length?
    L.map(i=>'<div class="ln"><span class="t">'+esc(i.title)+'</span><span class="p">'+eur(i.price)+'</span><button data-x="'+esc(i.id)+'" aria-label="Elimină">✕</button></div>').join('')+
    '<div class="tot"><span>Total</span><b>'+eur(total)+'</b></div><button class="pri" id="side-go">Comandă</button>'
    :'<p class="note">Gol deocamdată.</p>')+'</aside>'+ordersAside()+'</div>';
}

function openItem(it){
  if(!it)return;
  const o=modal((it.imgs.length?'<div class="gal" style="border-radius:12px;margin-bottom:12px">'+it.imgs.map(s=>'<img src="'+esc(s)+'" alt="">').join('')+'</div>':'')+'<h3>'+esc(it.title)+'</h3><p style="white-space:pre-wrap;color:var(--mut)">'+esc(it.desc)+'</p>'+(it.reserved&&!it.sold?'<p class="nd">Articolul nu este disponibil momentan</p>':'')+'<div class="price" style="font-size:1.3rem">'+eur(it.price)+'</div><div class="row">'+(it.sold?'<button disabled>Vândut</button>':it.reserved?'<button disabled>Indisponibil</button>':'<button class="pri" id="tg">'+(cart.includes(it.id)?'Elimină din coș':'Adaugă în coș')+'</button>')+'<button id="cl">Închide</button></div>');
  o.querySelector('#cl').onclick=()=>o.remove();
  const tg=o.querySelector('#tg');
  if(tg)tg.onclick=()=>{cart=cart.includes(it.id)?cart.filter(x=>x!==it.id):[...cart,it.id];saveCart();render();o.remove();};
}

function cartView(){
  const o=modal('');
  const draw=()=>{
    const nv=o.querySelector('#n'),pv=o.querySelector('#ph'),n0=nv?nv.value:'',p0=pv?pv.value:'';
    const L=cart.map(id=>S.items.find(i=>i.id===id)).filter(Boolean),total=L.reduce((t,i)=>t+i.price,0);
    o.querySelector('.dlg').innerHTML='<h3>Coșul meu</h3>'+(L.length?
      L.map(i=>'<div class="box"><b>'+esc(i.title)+'</b><small>'+eur(i.price)+'</small><button class="dng" style="margin-top:8px" data-rm="'+esc(i.id)+'">Elimină</button></div>').join('')+
      '<div class="box"><small>Total de plată</small><b>'+eur(total)+'</b></div>'+
      '<label>Numele tău</label><input id="n" autocomplete="name" value="'+esc(n0)+'"><label>Numărul tău de WhatsApp (cu prefixul țării)</label><input id="ph" type="tel" autocomplete="tel" inputmode="tel" placeholder="+40 712 345 678" value="'+esc(p0)+'">'+
      '<div class="row"><button id="cl">Continuă cumpărăturile</button><button class="pri" id="ok">Comandă</button></div>'
      :'<p class="note">Coșul tău este gol.</p><div class="row"><button id="cl">Închide</button></div>');
    o.querySelector('#cl').onclick=()=>o.remove();
    o.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{cart=cart.filter(x=>x!==b.dataset.rm);saveCart();render();draw();});
    const ok=o.querySelector('#ok');
    if(ok)ok.onclick=async()=>{
      const name=o.querySelector('#n').value.trim(),phone=o.querySelector('#ph').value.trim();
      if(!name||!/^(\+|00)\d[\d\s.-]{7,}$/.test(phone)){alert('Trebuie numele tău și numărul de WhatsApp cu prefixul țării, de exemplu +40 712 345 678.');return;}
      ok.disabled=true;ok.textContent='Se trimite…';
      try{
        await api('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({itemIds:cart,name,phone})});
        cart=[];saveCart();o.remove();refresh();pay(L,total,name,phone);
      }catch(x){alert(x.message);await refresh();draw();}
    };
  };
  draw();
}

function pay(L,total,name,phone){
  const wn=(S.settings.wa||'').replace(/\D/g,'');
  const wa=wn?'https://wa.me/'+wn+'?text='+encodeURIComponent('Bună, am făcut o comandă ('+L.map(i=>i.title).join(', ')+', total '+eur(total)+'). Numele meu: '+name):'';
  const o=modal('<h3>Mulțumim, '+esc(name)+'!</h3><p>Comanda ta a fost înregistrată: '+L.map(i=>esc(i.title)).join(', ')+'.<br>Total: <b>'+eur(total)+'</b></p>'+
   (wa?'<div class="box"><b>⚠️ Ultimul pas: anunță vânzătorul pe WhatsApp</b><small style="margin-top:6px">Este obligatoriu pentru ca vânzătorul să-ți confirme comanda. Apasă butonul de mai jos și trimite mesajul.</small></div>':'')+
   '<div class="box"><b>💵 Plata, de preferat în numerar (cash)</b><small style="margin-top:6px">Vânzătorul te va contacta pentru a vă înțelege.</small></div>'+
   '<div class="box"><b>📲 Altfel, vei primi numărul de cont (IBAN) în privat pe WhatsApp</b><small style="margin-top:6px">Vânzătorul îți scrie pe numărul indicat de tine ('+esc(phone)+').</small></div>'+
   '<p class="note">Dacă plătești prin transfer bancar, fă-o doar după ce ai primit mesajul lui. Comanda ta este confirmată imediat ce plata a fost primită.</p>'+
   '<div class="row">'+(wa?'<a class="btn pri" id="wa" target="_blank" rel="noopener" href="'+esc(wa)+'">Anunță vânzătorul pe WhatsApp</a>':'')+'<button id="cl"'+(wa?' disabled':'')+'>Închide</button></div>',!!wa);
  if(wa)o.querySelector('#wa').onclick=()=>{o.querySelector('#cl').disabled=false;};
  o.querySelector('#cl').onclick=()=>o.remove();
}

function waNote(x){
  const num=x.phone.replace(/[^\d+]/g,'').replace(/^\+/,'').replace(/^00/,'');
  const txt='Pace '+x.name+', am primit comanda ta ('+oi(x).map(i=>i.title).join(', ')+', total '+eur(ot(x))+') și am luat-o în considerare. Data viitoare când ne vedem facem schimbul. Să o porți sănătosă! Mulțumesc că ai cumpărat de la noi!';
  return 'https://wa.me/'+num+'?text='+encodeURIComponent(txt);
}

function waLink(x){
  const st=S.settings,num=x.phone.replace(/[^\d+]/g,'').replace(/^\+/,'').replace(/^00/,'');
  const txt='Bună '+x.name+', mulțumim pentru comandă ('+oi(x).map(i=>i.title).join(', ')+').\nTotal de plată : '+eur(ot(x))+'\n\nTransfer către: '+(st.holder||'')+'\nIBAN : '+(st.iban||'(de completat)')+'\nDetalii plată: '+x.name+'\n\nSpune-mi când ai făcut-o, mulțumesc!';
  return 'https://wa.me/'+num+'?text='+encodeURIComponent(txt);
}

function ordersView(){
  const o=modal('');
  const draw=()=>{
    const L=S.orders;
    o.querySelector('.dlg').innerHTML='<h3>Comenzi</h3>'+(L.length?L.map(x=>
     '<div class="box"><b>'+esc(oi(x).map(i=>i.title).join(', '))+' · '+eur(ot(x))+'</b><small>'+esc(x.name)+' · <a style="color:inherit" href="tel:'+esc(x.phone.replace(/[^\d+]/g,''))+'">'+esc(x.phone)+'</a></small><small>'+esc(new Date(x.date).toLocaleString('ro-RO'))+'</small>'+
     '<div class="row"><a class="btn pri" target="_blank" rel="noopener" href="'+esc(waLink(x))+'">💬 Trimite IBAN-ul pe WhatsApp</a></div>'+
     '<div class="row"><a class="btn" target="_blank" rel="noopener" href="'+esc(waNote(x))+'">💬 Mesaj: am luat comanda în considerare</a></div>'+
     '<div class="row"><label style="margin:0;display:flex;gap:8px;align-items:center;color:var(--tx)"><input type="checkbox" style="width:auto" data-paid="'+esc(x.id)+'"'+(x.paid?' checked':'')+'> Plătit</label><button class="dng" data-rm="'+esc(x.id)+'">Șterge</button></div></div>').join('')
     :'<p class="note">Nicio comandă deocamdată.</p>')+'<div class="row"><button id="cl">Închide</button></div>';
    o.querySelector('#cl').onclick=()=>o.remove();
    o.querySelectorAll('[data-paid]').forEach(c=>c.onchange=async()=>{
      try{await api('/api/orders/'+c.dataset.paid,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({paid:c.checked})});await refresh();draw();}catch(e){alert(e.message);}});
    o.querySelectorAll('[data-rm]').forEach(b=>b.onclick=async()=>{
      if(!confirm('Ștergi această comandă?'))return;
      try{await api('/api/orders/'+b.dataset.rm,{method:'DELETE'});await refresh();draw();}catch(e){alert(e.message);}});
  };
  draw();
}

function addForm(){
  let blobs=[];
  const o=modal('<h3>Articol nou</h3><label>Titlu</label><input id="t"><label>Descriere</label><textarea id="d" rows="3"></textarea><label>Preț</label><input id="p" type="number" min="0" step="0.01" inputmode="decimal"><label>Poze (maxim 6)</label><input id="f" type="file" accept="image/*" multiple><div class="thumbs" id="th"></div><div class="row"><button id="no">Anulează</button><button class="pri" id="ok">Publică</button></div>');
  o.querySelector('#no').onclick=()=>o.remove();
  o.querySelector('#f').onchange=async e=>{
    blobs=(await Promise.all([...e.target.files].slice(0,6).map(resize))).filter(Boolean);
    o.querySelector('#th').innerHTML=blobs.map(b=>'<img src="'+URL.createObjectURL(b)+'">').join('');};
  o.querySelector('#ok').onclick=async e=>{
    const t=o.querySelector('#t').value.trim(),p=o.querySelector('#p').value;
    if(!t||p===''){alert('Trebuie un titlu și un preț.');return;}
    const fd=new FormData();fd.append('title',t);fd.append('desc',o.querySelector('#d').value);fd.append('price',p);
    blobs.forEach((b,i)=>fd.append('images',b,'p'+i+'.jpg'));
    e.target.disabled=true;e.target.textContent='Se trimite…';
    try{await api('/api/items',{method:'POST',body:fd});o.remove();refresh();}
    catch(x){alert(x.message);e.target.disabled=false;e.target.textContent='Publică';}
  };
}

function settings(){
  const st=S.settings;
  const o=modal('<h3>Setări</h3><label>Numele magazinului</label><input id="s1" value="'+esc(st.shop)+'"><label>Numărul tău de WhatsApp (cu prefix, ex. 40712345678)</label><input id="s4" value="'+esc(st.wa)+'" inputmode="tel"><label>Titularul contului (vizibil doar pentru tine)</label><input id="s2" value="'+esc(st.holder)+'"><label>IBAN (vizibil doar pentru tine)</label><input id="s3" value="'+esc(st.iban)+'" placeholder="RO00 AAAA 0000 0000 0000 0000"><div class="row"><button id="no">Anulează</button><button class="pri" id="ok">Salvează</button></div>');
  o.querySelector('#no').onclick=()=>o.remove();
  o.querySelector('#ok').onclick=async()=>{
    try{await api('/api/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({shop:o.querySelector('#s1').value,wa:o.querySelector('#s4').value,holder:o.querySelector('#s2').value,iban:o.querySelector('#s3').value})});o.remove();refresh();}
    catch(e){alert(e.message);}};
}
refresh();
