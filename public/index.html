<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Magazinul meu</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#f472b6">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff5f9;--card:#fce7f3;--tx:#500724;--mut:#9d5c78;--ac:#f9a8d4;--acx:#831843;--bd:#f9a8d4}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,#f9a8d4,#f472b6 50%,#ec4899) fixed;color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:18px 16px;max-width:1000px;margin:auto}
h1{font:700 1.6rem/1.2 Georgia,serif;margin:0}
.bar{display:flex;gap:8px;flex-wrap:wrap}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--bd);background:#fdf2f8;color:var(--tx);padding:9px 14px;border-radius:10px;text-decoration:none;display:inline-block;text-align:center}
.pri{background:var(--ac);color:var(--acx);border-color:#f472b6;font-weight:700}
.dng{color:#dc2626}
.shop{max-width:1100px;margin:auto;padding:0 12px 30px;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
header{max-width:1100px}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.side{position:sticky;top:10px;max-height:calc(100vh - 20px);overflow:auto;display:flex;flex-direction:column;gap:8px}
aside{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:10px;font-size:.82rem}
aside h3{margin:0 0 6px;font-size:.95rem}
.ln{display:flex;gap:6px;align-items:flex-start;padding:5px 0;border-bottom:1px solid var(--bd)}
.ln .t{flex:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ln .p{font-weight:700;white-space:nowrap}
.ln button{border:none;background:none;color:var(--mut);padding:0 2px;font-size:.8rem}
.tot{display:flex;justify-content:space-between;padding:8px 0;font-size:1rem}
aside .pri{width:100%}
@media(min-width:700px){.shop{padding:0 16px 30px;gap:16px}main{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}aside{font-size:.95rem;padding:14px}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;background:var(--bd)}
.gal img{flex:0 0 100%;width:100%;aspect-ratio:1;object-fit:cover;scroll-snap-align:center}
.nopic{aspect-ratio:1;display:grid;place-items:center;color:var(--mut)}
.body{padding:8px;display:flex;flex-direction:column;gap:5px;flex:1}
.body h2{margin:0;font-size:.82rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.gal{cursor:pointer}
.body button{padding:6px 4px;font-size:.78rem;border-radius:8px}
@media(min-width:700px){.body h2{font-size:1rem}.body button{font-size:.9rem;padding:8px}}
.body p{display:none}
.price{font-weight:700;font-size:.95rem;flex:1}
@media(min-width:700px){.price{font-size:1.15rem}}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:50px 0}
footer{text-align:center;padding:0 0 30px}
footer a{color:var(--mut);font-size:.8rem;cursor:pointer;text-decoration:underline}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:9}
@media(min-width:600px){.ov{align-items:center}}
.dlg{background:var(--card);width:100%;max-width:460px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:20px}
@media(min-width:600px){.dlg{border-radius:18px}}
.dlg h3{margin:0 0 12px}
label{display:block;font-size:.85rem;color:var(--mut);margin:10px 0 4px}
input,textarea{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.row>*{flex:1}
.thumbs{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.thumbs img{width:56px;height:56px;object-fit:cover;border-radius:8px}
.box{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
.box small{color:var(--mut);display:block}.box b{word-break:break-all}
.note{color:var(--mut);font-size:.85rem}
.card,.dlg{color:var(--tx)}
h1{text-shadow:0 2px 10px rgba(255,255,255,.6)}
.empty{color:#831843}
footer a{color:#9d174d}
.nd{font-size:.72rem;color:#be123c;font-weight:600;line-height:1.2}
header,.shop,footer{position:relative;z-index:1}
.card.sold .gal,.card.sold .nopic{opacity:.4}
button:disabled{opacity:.6;cursor:default}
.vr{display:flex;gap:6px;margin-bottom:8px;align-items:center;flex-wrap:wrap}.vr .vp{display:flex;gap:4px;align-items:center}.vr .vp img{width:40px;height:40px;object-fit:cover;border-radius:8px}.vr [data-vn]{flex:2;min-width:90px}.vr [data-vp]{flex:1;min-width:70px}.vr button{padding:4px 8px}.vimg{width:64px;height:64px;object-fit:cover;border-radius:10px}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:30;display:flex;align-items:center;justify-content:center}
.zoom img{max-width:100%;max-height:100%;object-fit:contain}
.zoom button{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px}
.gal img,.vimg{cursor:zoom-in}
.sw{display:inline-block;width:.8em;height:.8em;border-radius:50%;border:1px solid rgba(0,0,0,.35);margin-right:5px;vertical-align:-1px}
.dlg .sw{width:1em;height:1em}
.vc{display:flex;gap:4px;align-items:center}.vc input[type=color]{width:34px;height:34px;padding:0;border:none;background:none;cursor:pointer}
.vc{flex-wrap:wrap}.vc.open{flex-basis:100%}.cp{flex-basis:100%;width:100%}.pal{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.pal button{width:26px;height:26px;border-radius:50%;padding:0;border:1px solid rgba(0,0,0,.35)}
.qs{display:inline-flex;align-items:center;gap:6px}.qs button{padding:0;width:26px;height:26px;border-radius:50%;line-height:1;font-size:1rem}.qs b{min-width:1.3em;text-align:center}.body .qs{display:flex;justify-content:center}.ln .t.c{display:block;overflow:visible}.tt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nd{color:#b91c1c;font-weight:700}.card .nd.top{background:#fee2e2;text-align:center;padding:5px 4px;font-size:.72rem;line-height:1.2}.dlg .nd{font-size:.9rem;margin-bottom:6px}.ln .nd{display:block;font-size:.72rem;margin-bottom:2px}.box .nd{margin-bottom:4px}
.sb{max-width:1100px;margin:0 auto 12px;padding:0 12px}
.sb input{font-size:1rem;border-radius:999px;padding:12px 16px}
#sp{margin-top:6px}
.chip{display:inline-block;margin:3px;padding:7px 12px;border-radius:999px;border:1px solid var(--bd);background:#fdf2f8;cursor:pointer;font-size:.9rem;color:var(--tx)}
.chip.on{background:var(--ac);font-weight:700;border-color:#f472b6}
.pnl{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:8px;margin-top:6px}
select{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.vr [data-cn],.vr [data-sn]{flex:1;min-width:120px}
body,button,.btn,.chip,input,textarea,select{font-family:'Open Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
body{font-size:16px;font-weight:600;letter-spacing:0}
button,.btn,.chip,label,.note,small,input,textarea,select{font-weight:600}
h1,h2,h3,.price{font-family:inherit;font-weight:700;letter-spacing:0}
h1{font-size:1.8rem}
h3{font-size:1.25rem}
/* cartes plus petites */
main{grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
.gal img,.nopic{aspect-ratio:5/4}
.body{padding:5px;gap:3px}
.body h2{font-size:.72rem}
.price{font-size:.8rem}
.body button{padding:4px 3px;font-size:.7rem}
.card .nd.top{font-size:.62rem;padding:3px 2px}
.body .qs button{width:22px;height:22px}
@media(min-width:700px){main{grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:10px}.body h2{font-size:.85rem}.price{font-size:.95rem}.body button{font-size:.78rem;padding:5px}}
.srt{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap}.srt select{flex:1;min-width:140px}.srt .chip{margin:0}
.bdg{align-self:flex-start;background:#be123c;color:#fff;border-radius:6px;padding:1px 6px;font-size:.62rem;font-weight:700}.old{color:var(--mut);font-weight:400;font-size:.75em}
.tp{position:fixed;inset:0;z-index:8;overflow:auto;background:linear-gradient(160deg,#f9a8d4,#f472b6 50%,#ec4899) fixed;padding:16px}.pg{max-width:560px;margin:auto;display:flex;flex-direction:column;gap:12px}.pg h2{margin:6px 0}.tl{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}.st{display:flex;align-items:center;gap:10px;padding:8px 0;opacity:.55}.st.done,.st.cur{opacity:1}.dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#fff;border:2px solid var(--bd);flex:none}.st.done .dot{background:#16a34a;color:#fff;border-color:#16a34a}.st.cur .dot{background:var(--ac);border-color:#f472b6}.st.cur span:last-child{font-weight:700}
.tl2{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px 6px 12px}
.tl2 .line,.tl2 .fill{position:absolute;top:32px;height:4px;border-radius:2px}
.tl2 .line{left:12.5%;right:12.5%;background:#e5e7eb}
.tl2 .fill{left:12.5%;width:0;background:#16a34a;transition:width .9s ease}
.tl2 .mv{position:absolute;top:33px;left:12.5%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:3px solid #ec4899;background:rgba(236,72,153,.15);z-index:2;transition:left .9s cubic-bezier(.4,0,.2,1);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(236,72,153,.5)}50%{box-shadow:0 0 0 10px rgba(236,72,153,0)}}
.tl2 .steps{display:grid;grid-template-columns:repeat(4,1fr);position:relative}
.tl2 .sp{text-align:center;padding:0 2px}
.tl2 .dot2{width:28px;height:28px;margin:0 auto;border-radius:50%;display:grid;place-items:center;background:#fff;border:2px solid var(--bd);position:relative;z-index:1;font-size:.8rem;transition:all .5s}
.tl2 .dot2.done{background:#16a34a;border-color:#16a34a;color:#fff}
.tl2 .dot2.cur{background:var(--ac);border-color:#ec4899}
.tl2 .sl{font-size:.72rem;margin-top:8px;opacity:.6;line-height:1.2}
.tl2 .sl.on{opacity:1;font-weight:700}
.bubwrap{max-width:1100px;margin:0 auto;padding:0 12px}.bub{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:8px 10px;margin-bottom:10px;cursor:pointer}.bh{display:flex;align-items:center;gap:8px;font-size:.85rem}.bh span{flex:1;color:var(--mut)}.bh button{padding:0 7px;border-radius:50%}
.tl2.mini{padding:10px 0 2px;border:none;background:none}.tl2.mini .line,.tl2.mini .fill{top:18px;height:3px}.tl2.mini .mv{top:20px;width:26px;height:26px;margin:-13px 0 0 -13px;border-width:2px}.tl2.mini .dot2{width:20px;height:20px;font-size:.6rem;border-width:1px}.tl2.mini .sl{font-size:.6rem;margin-top:4px}
.tr{display:flex;justify-content:space-between;align-items:center;min-height:16px}.fv{cursor:pointer;color:#be123c;font-size:1rem;line-height:1}.low{color:#b45309;font-size:.66rem;font-weight:700;line-height:1.2}.vr select{width:auto}
#splash{position:fixed;inset:0;z-index:50;display:grid;place-items:center;text-align:center;background:linear-gradient(160deg,#f9a8d4,#f472b6 50%,#ec4899);transition:opacity .45s}#splash.off{opacity:0;pointer-events:none}#splash h1{margin:8px 0}.gem{font-size:3rem;color:#fff;animation:pulse2 1.2s infinite}@keyframes pulse2{50%{transform:scale(1.15)}}
.rv{max-width:1100px;margin:0 auto;padding:0 12px 20px}.rvl{display:flex;gap:8px;overflow-x:auto}.rvi{flex:0 0 84px;background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden;cursor:pointer;font-size:.7rem}.rvi img{width:100%;aspect-ratio:1;object-fit:cover;display:block}.rvi span{display:block;padding:3px 4px;line-height:1.2;max-height:2.5em;overflow:hidden}
.vac{background:#fef3c7;border:1px solid #f59e0b;color:#78350f;border-radius:14px;padding:10px 12px;margin-bottom:10px}
.chart{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:10px}.cb{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}.cb .bar{width:100%;max-width:34px;background:linear-gradient(#f472b6,#db2777);border-radius:6px 6px 0 0}.cv{font-size:.6rem}.cl{font-size:.62rem;margin-top:3px}
.rvb{width:100%;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-radius:14px}.rvb b{font-size:1.4rem;line-height:1}
.rg{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}.rc{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden;cursor:pointer}.rc img{width:100%;aspect-ratio:1;object-fit:cover;display:block}.rt{padding:4px 6px;font-size:.8rem;line-height:1.2;max-height:2.6em;overflow:hidden}.rpx{padding:0 6px 6px;font-weight:700;font-size:.85rem}
</style>
</head>
<body>
<div id="splash"><div><div class="gem">◆</div><h1>Baticuri</h1><p>Se încarcă…</p></div></div>
<div id="root"></div>
<footer id="foot"></footer>
<script>
const $=s=>document.querySelector(s);
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CUR='EUR'; // schimbă în 'RON' pentru lei
const eur=n=>new Intl.NumberFormat('ro-RO',{style:'currency',currency:CUR}).format(n);
let S={settings:{},items:[],orders:[],categories:[]},admin=false,cart=[];
let q='',fcat='',fsub='',sopen=false,sortk='new',oa=false,ofv=false,promoA=null,nouSession=new Set(),nouInit=false,pushRole=null;
let lang=(()=>{try{return localStorage.getItem('lang')==='fr'?'fr':'ro';}catch(e){return 'ro';}})();
try{cart=JSON.parse(localStorage.getItem('cart')||'[]');}catch(e){}
const saveCart=()=>{try{localStorage.setItem('cart',JSON.stringify(cart));}catch(e){}};
const lno=i=>i.title+(i.qty>1?' ×'+i.qty:'');
const oi=x=>x.items||[{id:x.itemId,title:x.title,price:x.price}];
const ot=x=>x.total!=null?x.total:oi(x).reduce((t,i)=>t+i.price*(i.qty||1),0);

async function api(url,opt){
  const r=await fetch(url,opt);const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||'Eroare');return j;
}
async function refresh(){
  S=await api('/api/shop');admin=(await api('/api/me')).admin;S.orders=admin?await api('/api/orders'):[];
  const cnt={};cart=cart.filter(k=>{const u=unit(k);if(!u||u.sold||!(u.left>0))return true;cnt[k]=(cnt[k]||0)+1;return cnt[k]<=u.left;});saveCart();
  if(!nouInit){nouInit=true;try{const seen=JSON.parse(localStorage.getItem('seenNou')||'[]'),nou=S.items.filter(i=>i.badge==='Nou').map(i=>i.id);nouSession=new Set(nou.filter(id=>!seen.includes(id)));localStorage.setItem('seenNou',JSON.stringify([...new Set([...seen,...nou])]));}catch(e){}}
  if(pushRole!==admin){pushRole=admin;pushSync();}
  document.title=S.settings.shop;render();renderSearch();
}
function modal(html,lock){
  const o=document.createElement('div');o.className='ov';o.innerHTML='<div class="dlg">'+html+'</div>';
  if(!lock)o.addEventListener('click',e=>{if(e.target===o)o.remove();});document.body.appendChild(o);return o;
}
function resize(file){return new Promise(res=>{
  const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{
    const k=Math.min(1,1200/Math.max(i.width,i.height)),c=document.createElement('canvas');
    c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);
    c.toBlob(b=>res(b),'image/jpeg',.82);};i.onerror=()=>res(null);i.src=r.result;};
  r.onerror=()=>res(null);r.readAsDataURL(file);});}

function render(){
  const st=S.settings;
  $('#top').innerHTML=
   '<header><h1>'+esc(st.shop)+'</h1>'+'<div class="bar"><button id="lang">'+(lang==='fr'?'RO':'FR')+'</button><button id="pushb" aria-label="Notificări">🔔</button>'+(myOrders().length?'<button id="mine">Comenzile mele</button>':'')+'<button class="pri" id="cartb">🛒 Coș'+(cartCount()?' ('+cartCount()+')':'')+'</button>'+(admin?'<button class="pri" id="add">+ Articol</button><button id="ord">Comenzi'+(S.orders.filter(x=>!x.paid).length?' ('+S.orders.filter(x=>!x.paid).length+')':'')+'</button><button id="promos">Coduri promo</button><button id="trash">Gunoi</button><button id="stats">Statistici</button><button id="cats">Categorii</button><button id="set">Setări</button><button id="out">Deconectare</button>':'')+'</div>'+'</header>'+vacBanner();
  $('#rest').innerHTML='<div class="shop"><main>'+(shown().length?shown().map(it=>
    '<div class="card'+(it.sold||it.reserved?' sold':'')+'">'+(it.hidden?'<div class="nd top">Ascuns – doar tu îl vezi</div>':'')+(it.sold||it.reserved?'<div class="nd top">Articolul nu mai este disponibil</div>':(it.variants&&it.variants.some(v=>v.sold||v.reserved)?'<div class="nd top">Unele variante nu mai sunt disponibile</div>':''))+(it.imgs.length?'<div class="gal" data-open="'+esc(it.id)+'">'+it.imgs.map(s=>'<img loading="lazy" src="'+esc(s)+'" alt="">').join('')+'</div>':'<div class="nopic">Fără poză</div>')+
    '<div class="body">'+'<div class="tr">'+((it.badge&&(it.badge!=='Nou'||admin||nouSession.has(it.id)))?'<span class="bdg">'+esc(it.badge)+'</span>':'<span></span>')+'<span class="fv" data-fav="'+esc(it.id)+'">'+(isFav(it.id)?'♥':'♡')+'</span></div>'+'<h2 data-open="'+esc(it.id)+'">'+sw(it.color)+esc(it.title)+'</h2><p>'+esc(it.desc)+'</p><div class="price">'+(it.oldPrice?'<s class="old">'+eur(it.oldPrice)+'</s> ':'')+(it.variants&&it.variants.length?'de la ':'')+eur(it.price)+'</div>'+lowCard(it)+
    (it.sold?'<button disabled>Vândut</button>':it.reserved?'<button disabled>Indisponibil</button>':(it.variants&&it.variants.length)?'<button class="pri" data-open="'+esc(it.id)+'">Alege</button>':(qOf(it.id)?stepper(it.id):'<button class="pri" data-cart="'+esc(it.id)+'">＋ Coș</button>'))+
    (admin?'<button data-edit="'+esc(it.id)+'">Editează</button><button data-dup="'+esc(it.id)+'">Duplică</button><button data-hide="'+esc(it.id)+'">'+(it.hidden?'Arată':'Ascunde')+'</button><button class="dng" data-del="'+esc(it.id)+'">Șterge</button>':'')+'</div></div>').join('')
    :'<div class="empty">'+(q||fcat?'Niciun rezultat.':'Niciun articol deocamdată.')+'</div>')+'</main>'+sideHtml()+'</div>'+recentHtml();
  $('#foot').innerHTML='<a id="about">Despre noi / Contact</a>'+(admin?'':' · <a id="login">Zonă vânzător</a>');
  $('#about').onclick=aboutView;
  if($('#login'))$('#login').onclick=loginForm;
  if(admin){
    $('#add').onclick=addForm;$('#ord').onclick=ordersView;
    document.querySelectorAll('[data-dup]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await api('/api/items/'+b.dataset.dup+'/duplicate',{method:'POST'});refresh();}catch(e){alert(e.message);b.disabled=false;}});
    document.querySelectorAll('[data-hide]').forEach(b=>b.onclick=async()=>{const it=S.items.find(x=>x.id===b.dataset.hide);try{await api('/api/items/'+it.id+'/hidden',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({hidden:!it.hidden})});refresh();}catch(e){alert(e.message);}});
    document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editForm(S.items.find(x=>x.id===b.dataset.edit)));$('#set').onclick=settings;$('#cats').onclick=catsEditor;$('#stats').onclick=statsView;$('#promos').onclick=promosEditor;$('#trash').onclick=trashView;
    $('#out').onclick=async()=>{await api('/api/logout',{method:'POST'});refresh();};
    document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
      if(!confirm('Ștergi acest articol?'))return;
      try{await api('/api/items/'+b.dataset.del,{method:'DELETE'});refresh();}catch(e){alert(e.message);}});

function weekStart(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
function salesChart(orders,mode){
  const now=new Date(),n=mode==='m'?6:8,B=[];
  for(let i=n-1;i>=0;i--){
    const d=new Date(now);
    if(mode==='m'){d.setDate(1);d.setMonth(d.getMonth()-i);B.push({k:d.getFullYear()+'-'+d.getMonth(),l:(d.getMonth()+1)+'/'+String(d.getFullYear()).slice(2),v:0});}
    else{d.setDate(d.getDate()-i*7);const w=weekStart(d);B.push({k:w.getTime(),l:w.getDate()+'.'+(w.getMonth()+1),v:0});}
  }
  orders.filter(o=>o.paid).forEach(o=>{const d=new Date(o.date),k=mode==='m'?d.getFullYear()+'-'+d.getMonth():weekStart(d).getTime(),b=B.find(x=>x.k===k);if(b)b.v+=ot(o);});
  const max=Math.max(...B.map(b=>b.v),0),tot=B.reduce((t,b)=>t+b.v,0);
  return '<div class="chart">'+B.map(b=>'<div class="cb"><div class="cv">'+(b.v?Math.round(b.v):'')+'</div><div class="bar" style="height:'+(max?Math.max(2,Math.round(b.v/max*100)):2)+'px"></div><div class="cl">'+b.l+'</div></div>').join('')+'</div><small>Total perioadă: '+eur(tot)+'</small>';
}
function lowList(){

    else if(it.qty>1&&!it.sold&&it.left<=2)L.push(it.title+' – '+(it.left===0?'epuizat':'mai sunt '+it.left));
  });
  return L;
}

const qOf=k=>cart.filter(x=>x===k).length;

const subOne=k=>{const i=cart.indexOf(k);if(i>=0){cart.splice(i,1);saveCart();}};
function cartLines(){const m=new Map();cart.forEach(k=>m.set(k,(m.get(k)||0)+1));return [...m].map(([k,q])=>{const u=unit(k);if(!u)return {id:k,title:'Articol șters',price:0,q,bad:true,gone:true};return {...u,q,bad:!!(u.sold||!(u.left>0))};});}

function unit(key){

  if((it.variants||[]).length)return null;
  return {id:key,title:it.title,price:it.price,sold:it.sold,reserved:it.reserved,left:it.left};
}

async function trackPage(id){

  const N=STEPS.length,pos=k=>((k+0.5)/N*100)+'%';

  const draw=async()=>{
    let r;

      box.innerHTML='<div class="pg"><button id="tb">← Înapoi la magazin</button><h2>Comanda ta</h2><div class="box" id="ti"></div><div class="tl2"><div class="line"></div><div class="fill" id="fl"></div><div class="mv" id="mv"></div><div class="steps">'+STEPS.map(x=>'<div class="sp"><div class="dot2"></div><div class="sl">'+x[1]+'</div></div>').join('')+'</div></div><div class="box" id="td"></div><div id="tn"></div><p class="note">Starea se actualizează automat.</p><div id="tw"></div></div>';
      box.querySelector('#tb').onclick=closeTrack;
      box.querySelector('#mv').style.left=pos(0);
    }
    box.querySelector('#ti').innerHTML='<b>'+esc(r.items.map(i=>i.title+(i.qty>1?' ×'+i.qty:'')).join(', '))+'</b><small>Total: '+eur(r.total)+' · '+(r.paid?'Plătită':'Neplătită')+'</small>';
    box.querySelector('#td').innerHTML='<b>'+esc(STEPS[cur][2])+'</b>';
    box.querySelector('#tn').innerHTML=r.note?'<div class="box"><small>Mesaj de la vânzător</small><b style="white-space:pre-wrap">'+esc(r.note)+'</b></div>':'';
    box.querySelector('#tw').innerHTML=wn?'<a class="btn pri" target="_blank" rel="noopener" href="https://wa.me/'+wn+'">Contactează vânzătorul pe WhatsApp</a>':'';
    box.querySelectorAll('.sp').forEach((el,i)=>{
      const d=el.querySelector('.dot2');d.className='dot2'+(i<cur?' done':i===cur?' cur':'');d.textContent=i<cur?'✓':String(i+1);

    });
    const go=()=>{box.querySelector('#mv').style.left=pos(cur);box.querySelector('#fl').style.width=(cur/N*100)+'%';};
    if(first){first=false;setTimeout(go,150);}else go();
  };
  await draw();
  clearInterval(box._t);box._t=setInterval(draw,15000);
}
const TST=[['new','Primită'],['confirmed','Confirmată'],['ready','Pregătită'],['delivered','Predată']];
let bubId='',bubFirst=true,bubDis='',bubTimer=0;
async function refreshBubble(){
  const el=document.getElementById('mybub');if(!el)return;
  const ids=myOrders().slice(0,5),clear=()=>{el.innerHTML='';bubId='';};
  const cand=bubId&&ids.includes(bubId)?[bubId,...ids.filter(x=>x!==bubId)]:ids;
  let id='',r=null;
  for(const c of cand){
    try{const t=await api('/api/orders/'+encodeURIComponent(c)+'/track');
      if(t.status!=='delivered'||(c===bubId&&el.querySelector('.tl2'))){id=c;r=t;break;}
    }catch(e){}
  }
  if(!id||bubDis===id){clear();return;}
  const N=TST.length,cur=Math.max(0,TST.findIndex(x=>x[0]===(r.status||'new'))),pos=k=>((k+0.5)/N*100)+'%';
  if(bubId!==id||!el.querySelector('.tl2')){
    bubId=id;bubFirst=true;
    el.innerHTML='<div class="bub"><div class="bh"><b>Comanda ta</b><span id="bs"></span><button type="button" id="bx" aria-label="Închide">✕</button></div><div class="tl2 mini"><div class="line"></div><div class="fill"></div><div class="mv" style="left:'+pos(0)+'"></div><div class="steps">'+TST.map(x=>'<div class="sp"><div class="dot2"></div><div class="sl">'+x[1]+'</div></div>').join('')+'</div></div></div>';
    el.querySelector('.bub').onclick=e=>{if(e.target.id==='bx'){bubDis=id;el.innerHTML='';bubId='';return;}trackPage(id);};
  }
  el.querySelector('#bs').textContent=TST[cur][1];
  el.querySelectorAll('.sp').forEach((sp,i)=>{const d=sp.querySelector('.dot2');d.className='dot2'+(i<cur?' done':i===cur?' cur':'');d.textContent=i<cur?'✓':String(i+1);sp.querySelector('.sl').className='sl'+(i===cur?' on':'');});
  const go=()=>{const mv=el.querySelector('.mv'),fl=el.querySelector('.fill');if(mv){mv.style.left=pos(cur);fl.style.width=(cur/N*100)+'%';}};
  if(bubFirst){bubFirst=false;setTimeout(go,150);}else go();
  if(r.status==='delivered'&&!bubTimer)bubTimer=setTimeout(()=>{bubTimer=0;clear();},8000);
}

      if(!o.querySelector('#gdpr').checked){alert('Trebuie să bifezi acordul pentru folosirea datelor.');return;}
      const ids=cart.filter(k=>good.some(g=>g.id===k));
      ok.disabled=true;ok.textContent='Se trimite…';
      try{
        const r=await api('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({itemIds:ids,name,phone,promo:promoA?promoA.code:'',consent:true})});
        try{const m=myOrders();m.unshift(r.id);localStorage.setItem('myorders',JSON.stringify(m.slice(0,20)));}catch(e){}
        promoA=null;const done=new Set(ids);cart=cart.filter(k=>!done.has(k));saveCart();o.remove();bubDis='';pushSync();refresh();refreshBubble();pay(good,total,name,phone,r.id);
      }catch(x){alert(x.message);await refresh();draw();}
    };
  };
  draw();
}

const sw=c=>c&&/^#[0-9a-f]{6}$/i.test(c)?'<span class="sw" style="background:'+c+'"></span>':'';

function pickFromPhoto(srcs,onPick){
  if(!srcs.length){alert('Adaugă mai întâi o poză.');return;}
  const o=modal('<h3>Alege culoarea din poză</h3><p class="note">Apasă pe poză, exact în locul cu culoarea dorită.</p><div class="thumbs" id="pt">'+srcs.map((x,i)=>'<img src="'+esc(x)+'" data-p="'+i+'" style="cursor:pointer">').join('')+'</div><canvas id="cv" style="width:100%;margin-top:8px;border-radius:10px"></canvas><div class="row" style="align-items:center"><span id="pv" class="sw" style="width:34px;height:34px;flex:none;margin:0;background:transparent"></span><button class="pri" id="ok" disabled>Folosește culoarea</button><button id="no">Anulează</button></div>');
  const cv=o.querySelector('#cv'),ctx=cv.getContext('2d',{willReadFrequently:true});let cur='';
  const load=src=>{
    const im=new Image();im.crossOrigin='anonymous';
    im.onload=()=>{const k=Math.min(1,700/Math.max(im.width,im.height));cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);ctx.drawImage(im,0,0,cv.width,cv.height);};
    im.onerror=()=>alert('Nu pot citi această poză. Încearcă cu o poză nouă.');
    im.src=src;
  };
  o.querySelectorAll('[data-p]').forEach(t=>t.onclick=()=>load(srcs[+t.dataset.p]));
  load(srcs[0]);
  cv.onclick=e=>{
    const r=cv.getBoundingClientRect(),x=Math.round((e.clientX-r.left)*cv.width/r.width),y=Math.round((e.clientY-r.top)*cv.height/r.height);
    try{
      const x0=Math.max(0,x-4),y0=Math.max(0,y-4),w=Math.min(9,cv.width-x0),h=Math.min(9,cv.height-y0),d=ctx.getImageData(x0,y0,w,h).data;
      let R=0,G=0,B=0,n=d.length/4;
      for(let i=0;i<d.length;i+=4){R+=d[i];G+=d[i+1];B+=d[i+2];}
      cur='#'+[R,G,B].map(v=>Math.round(v/n).toString(16).padStart(2,'0')).join('');
      o.querySelector('#pv').style.background=cur;o.querySelector('#ok').disabled=false;
    }catch(err){alert('Această poză nu poate fi citită. Încearcă cu o poză nouă.');}
  };
  o.querySelector('#no').onclick=()=>o.remove();
  o.querySelector('#ok').onclick=()=>{onPick(cur);o.remove();};
}

function colorPicker(box,init,cb,getSrcs){
  const st={v:init||''};let open=false;
  const PRE=['#87ceeb','#1e90ff','#00008b','#2e8b57','#90ee90','#ffd700','#ff8c00','#ff0000','#ff69b4','#800080','#8b4513','#808080','#000000','#ffffff'];
  const set=v=>{st.v=v;if(cb)cb(v);draw();};
  const draw=()=>{
    box.classList.toggle('open',open);
    box.innerHTML='<button type="button" data-tog>'+(st.v?'<span class="sw" style="background:'+esc(st.v)+';margin:0"></span> ':'🎨 ')+'Culoare</button>'+
      (open?'<div class="cp"><div class="pal">'+PRE.map(c=>'<button type="button" data-pc="'+c+'" style="background:'+c+'"></button>').join('')+'</div><div class="row" style="margin-top:6px"><input type="color" data-cc value="'+esc(st.v||'#87ceeb')+'"><button type="button" data-pp>💧 Pipetă din poză</button><button type="button" data-cx>✕ Fără</button></div></div>':'');
    box.querySelector('[data-tog]').onclick=()=>{open=!open;draw();};
    box.querySelectorAll('[data-pc]').forEach(x=>x.onclick=()=>set(x.dataset.pc));
    const cc=box.querySelector('[data-cc]');
    if(cc){cc.oninput=()=>{st.v=cc.value;if(cb)cb(cc.value);};cc.onchange=()=>set(cc.value);}
    const pp=box.querySelector('[data-pp]');if(pp)pp.onclick=()=>pickFromPhoto(getSrcs?getSrcs():[],c=>set(c));
    const cx=box.querySelector('[data-cx]');if(cx)cx.onclick=()=>set('');
  };
  draw();return st;
}

    o.querySelectorAll('[data-vp]').forEach(x=>x.oninput=()=>{V[+x.dataset.vp].price=x.value;});

    o.querySelectorAll('[data-vg]').forEach(x=>x.onclick=()=>o.querySelector('[data-vf="'+x.dataset.vg+'"]:not([capture])').click());
    o.querySelectorAll('[data-vd]').forEach(x=>x.onclick=()=>{const v=V[+x.dataset.vd];v.file=null;v.url='';v.img='';draw();});
    o.querySelectorAll('[data-vq]').forEach(b=>{const k=+b.dataset.vq;qtyInput(b,V[k].qty||1,n=>{V[k].qty=n;});});
    o.querySelectorAll('[data-vcol]').forEach(b=>{const k=+b.dataset.vcol;colorPicker(b,V[k].color,c=>{V[k].color=c;},()=>[...new Set([V[k].url,...(getSrcs?getSrcs():[])].filter(Boolean))]);});

    });
  };
  o.querySelector('#addv').onclick=()=>{V.push({name:'',price:'',img:'',file:null,url:'',color:'',qty:1});draw();};
  draw();
  return V;

function trNode(t){
  const tt=t.trim();if(!tt)return t;
  const m=tt.match(/^([^\p{L}]*)([\s\S]*)$/u),pre=m[1],core=m[2];
  if(EX[core]!==undefined)return t.replace(tt,pre+EX[core]);
  let r=t;
  for(const [a,b] of PRE){if(core.startsWith(a)){r=t.replace(a,b);break;}}
  for(const [a,b] of SUB){if(r.includes(a))r=r.split(a).join(b);}
  return r;
}
function trDom(root){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),L=[];let n;
  while((n=w.nextNode())){if(n.parentNode&&/^(SCRIPT|STYLE|TEXTAREA)$/.test(n.parentNode.nodeName))continue;L.push(n);}
  L.forEach(x=>{const r=trNode(x.nodeValue);if(r!==x.nodeValue)x.nodeValue=r;});
  root.querySelectorAll('[placeholder],[title],[aria-label]').forEach(e=>['placeholder','title','aria-label'].forEach(a=>{const v=e.getAttribute(a);if(v){const r=trNode(v);if(r!==v)e.setAttribute(a,r);}}));
}
function startLang(){
  document.documentElement.lang='fr';
  const A=window.alert.bind(window),C=window.confirm.bind(window);
  window.alert=m=>A(trNode(String(m)));window.confirm=m=>C(trNode(String(m)));
  let busy=false,pend=false;
  const obs=new MutationObserver(()=>{if(busy||pend)return;pend=true;requestAnimationFrame(()=>{pend=false;busy=true;trDom(document.body);busy=false;});});
  trDom(document.body);
  obs.observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['placeholder','title','aria-label']});
}
