<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111015">
  <title>Baticuri Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css">
  <script src="/admin/admin.js" defer></script>
</head>
<body>
  <div id="loginScreen" class="login-screen">
    <form id="loginForm" class="login-card">
      <div class="brand-mark">B</div>
      <p class="eyebrow">ESPACE SÉCURISÉ</p>
      <h1>Baticuri <span>Admin</span></h1>
      <p class="muted">Connecte-toi pour gérer ta boutique.</p>
      <label for="adminPassword">Mot de passe administrateur</label>
      <input id="adminPassword" type="password" autocomplete="current-password" placeholder="Ton mot de passe" required>
      <button class="btn btn-primary full" type="submit">Se connecter <span>→</span></button>
      <p id="loginError" class="form-error" role="alert"></p>
    </form>
  </div>

  <div id="appShell" class="app-shell hidden">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-top">
        <a class="brand" href="/admin/">
          <span class="brand-mark small">B</span>
          <span><strong>Baticuri</strong><small>ADMINISTRATION</small></span>
        </a>
        <button id="closeSidebar" class="icon-btn mobile-only" aria-label="Fermer le menu">×</button>
      </div>

      <div class="nav-caption">MENU PRINCIPAL</div>
      <nav class="nav-list" aria-label="Navigation principale">
        <button class="nav-link active" data-page="overview"><span class="nav-icon">▦</span>Vue d'ensemble</button>
        <button class="nav-link" data-page="products"><span class="nav-icon">◇</span>Produits</button>
        <button class="nav-link" data-page="orders"><span class="nav-icon">▤</span>Commandes <i id="newOrdersBadge" class="nav-badge hidden">0</i></button>
        <button class="nav-link" data-page="customers"><span class="nav-icon">♙</span>Clients</button>
        <button class="nav-link" data-page="categories"><span class="nav-icon">▧</span>Catégories</button>
        <button class="nav-link" data-page="promos"><span class="nav-icon">％</span>Promotions</button>
      </nav>

      <div class="nav-caption">RELATION CLIENT</div>
      <nav class="nav-list">
        <button class="nav-link" data-page="reviews"><span class="nav-icon">☆</span>Avis clients</button>
        <button class="nav-link" data-page="waitlist"><span class="nav-icon">◷</span>Liste d'attente</button>
      </nav>

      <div class="nav-caption">BOUTIQUE</div>
      <nav class="nav-list">
        <button class="nav-link" data-page="trash"><span class="nav-icon">⌫</span>Corbeille</button>
        <button class="nav-link" data-page="settings"><span class="nav-icon">⚙</span>Paramètres</button>
      </nav>

      <div class="sidebar-bottom">
        <div class="admin-profile">
          <div class="avatar">A</div>
          <div><strong>Administrateur</strong><small>Accès sécurisé</small></div>
          <button id="logoutBtn" class="icon-btn logout" title="Déconnexion" aria-label="Déconnexion">↗</button>
        </div>
        <a class="store-link" href="/" target="_blank" rel="noopener">Voir la boutique <span>↗</span></a>
      </div>
    </aside>

    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button id="openSidebar" class="icon-btn menu-toggle" aria-label="Ouvrir le menu">☰</button>
          <div><p class="eyebrow">BATICURI / ADMIN</p><h2 id="pageTitle">Vue d'ensemble</h2></div>
        </div>
        <div class="topbar-actions">
          <span class="live-dot">Boutique connectée</span>
          <button id="refreshBtn" class="icon-btn" title="Actualiser" aria-label="Actualiser">↻</button>
          <a class="top-store-link" href="/" target="_blank" rel="noopener">Voir la boutique ↗</a>
        </div>
      </header>

      <section class="page-wrap">
        <div id="pageContent" aria-live="polite">
          <div class="loading-state"><span class="spinner"></span>Chargement du dashboard…</div>
        </div>
      </section>
    </main>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
